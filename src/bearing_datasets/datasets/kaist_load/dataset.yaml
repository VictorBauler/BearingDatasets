name: kaist_load
title: KAIST vibration, acoustic, temperature and motor current dataset under varying load
description: |
  Rotating machine test bed (3 hp motor, gearbox, two bearing housings A and B, rotor
  disks, hysteresis brake) at 3010 rpm under 0, 2 and 4 Nm. States: normal; inner and
  outer race faults of 0.3, 1.0 and 3.0 mm on the NSK 6205 DDU bearing in housing A;
  parallel shaft misalignment of 0.1, 0.3 and 0.5 mm at housing A; unbalance of 583 to
  3318 mg on the disk closest to housing A. 15 states x 3 loads.
  Three separate acquisitions per state, stored as separate recordings: vibration
  (x and y on each housing, 25.6 kHz, Simcenter SCADAS), temperature of both housings
  and three motor phase currents (NI FlexLogger, 25608 Hz from the file time step),
  and acoustic (one microphone, 51.2 kHz, only normal and bearing faults of 0.3 and
  1.0 mm at 0 Nm). 60 s per faulty recording; normal recordings are longer.
  Phases V and W are empty in the 9 outer race current files (only phase U there).
  Vibration in m/s^2: the paper says g, but the Test.Lab MAT export stores SI values
  ("Data saved by Test.Lab in MKS", quantity L T^-2; g is only a display factor of
  0.10197), and the quantisation step matches a 100 mV/g sensor read in m/s^2.
