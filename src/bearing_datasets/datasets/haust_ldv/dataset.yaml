columns:
  bpfo: >-
    SKF 6206: 9 balls of 9.525 mm on a 46 mm pitch, from published studies of this bearing
    (not the dataset's documents)
  fault_size_mm: pitting size (0 if healthy)
  operating_condition: load case A (100 N axial, 0 N radial) or B (100 N axial, 50 N radial)
  load: radial load in N (the axial load is 100 N in both cases)
  fault_severity: pitting size; levels 1-3 per fault type (races 0.2, 0.3, 0.5 mm; roller 0.5, 0.8, 1.0 mm)
