name: ferrara_or
title: University of Ferrara acceleration signals of rolling element bearings with artificial outer ring defects
description: |
  SKF 1205 ETN9 self-aligning ball bearings with rectangular EDM defects on the outer ring,
  of three nominal widths (D1 ~0.93 mm, D2 ~1.66 mm, D3 ~2.50 mm), each made on three
  different bearings (a, b, c; measured widths in fault_size_mm), at 1000 and 2000 N and
  20, 30 and 40 Hz: 54 recordings of 15 s, one accelerometer (PCB 356B21) on top of the
  case, radial, in g, 51.2 kHz (25.6 kHz for bearing D2a). There are no healthy
  recordings. Three bearings per defect size allow testing on unseen bearings of the same
  size (split by bearing_id).
