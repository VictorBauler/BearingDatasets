name: susu
title: SUSU bearing dataset with a shaft-mounted wireless sensor (South Ural State University)
description: |
  ER-16K bearings on a 1-inch shaft, measured by a wireless acceleration sensor fixed
  on the rotating shaft near the test bearing (three tangential MEMS accelerometers on a
  disk). Five test bearings: healthy, inner race, outer race, ball, and one with all
  three faults, made with a rotary tool. 31.175 kHz, at 20 Hz (1200 rpm, the set
  described in the paper, 64 s) and 18 Hz (an extra set in the repository, not
  described, 19 s). Each file holds three signals that the authors call linear and
  angular acceleration; their order and unit are not documented (ch1-ch3).
license: unspecified (cite the paper)
size: "download 0.29 GB, built 0.34 GB (measured)"
homepage: https://github.com/SUSU-CM/Bearings-dataset
citation: |
  Sinitsin, V., Ibryaeva, O., Sakovskaya, V., & Eremeeva, V. (2022). Intelligent bearing
  fault diagnosis method combining mixed input and hybrid CNN-MLP model. Mechanical
  Systems and Signal Processing, 180, 109454. doi:10.1016/j.ymssp.2022.109454
