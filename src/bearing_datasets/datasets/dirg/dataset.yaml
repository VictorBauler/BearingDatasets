columns:
  bpfo: >-
    from the dataset description, Table 1: A1 channels bearing B1 (10 rollers of 9.0 mm,
    pitch 40.5 mm), A2 channels the loaded bearing B2 (16 rollers of 8.0 mm, pitch 54.0 mm)
  load: radial load on B2 in N, from the load cell voltage in the file name (0.499 mV/N)
  fault_size_mm: diameter of the conical indentation
  fault_severity: indentation diameter (150, 250, 450 um), levels 1-3
  session: stationary (speed and load combinations) or endurance (230 h monitoring)
  acquisition: stationary, repetition 1 or 2; endurance, file number (increasing with time)
