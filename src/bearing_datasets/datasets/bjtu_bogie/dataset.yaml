      BJTU_RAO_Bogie_Datasets.z02: https://drive.usercontent.google.com/download?id=1BWc5YQUyoNsEAzCstvXDRHj4xtZOG9_L&export=download&confirm=t
      BJTU_RAO_Bogie_Datasets.zip: https://drive.usercontent.google.com/download?id=1uq0U3N3Oq4BPGhUZRw5XWdEVX1YWqijG&export=download&confirm=t
files: [BJTU_RAO_Bogie_Datasets.z01, BJTU_RAO_Bogie_Datasets.z02, BJTU_RAO_Bogie_Datasets.zip]
columns:
  sensor_position: >-
    where on the component the sensor is: drive_end, fan_end, cable (currents),
    shaft (speed), input_axle, output_axle, end_cover, near (microphones)
  fault_detail: the faults of the recording in words, from the health codes; 'none' if healthy
  motor_speed_hz: motor speed of the working condition, in Hz (20, 40 or 60)
  rpm: motor speed in rpm (motor_speed_hz x 60)
  load: lateral load in kN (0, +10 toward the motor, -10 toward the gearbox)
  working_condition: working condition 1-9 (Sample_1 ... Sample_9 folders)
