name: urma_crti
title: URMA-CRTI rolling element bearing vibration data (CRTI, Annaba, Algeria)
description: |
  A 0.37 kW induction motor driven by a variable speed drive; the tested bearing
  supports the drive-side shaft. States: healthy, outer race, inner race, ball and
  combined fault, at supply frequencies of 30, 35, 40, 45 and 50 Hz (healthy has no
  50 Hz and outer race no 40 Hz recording): 23 recordings of 10.24 s at 25.6 kHz.
  The record mentions three accelerometers (CTC AC140-2D, 100 mV/g), but the file
  holds one signal per recording. The unit is not stated; the values are not the sensor
  volts (peaks above 100), and peaks above the sensor's +-50 g suggest m/s^2. Labels are the French codes of the variable names
  (s = sain/healthy, ci/ce = inner/outer ring, b = bille/ball, c = combined); which
  faults the combined bearing has is not stated, so its fault_type is `bearing`.
