name: sqv
title: SQ variable-speed bearing dataset (SQV)
description: |
  NSK 6203 bearing at the drive end of the motor of a SpectraQuest simulator, in 7
  states: normal and machined single-point inner (IF) and outer (OF) ring defects at 3
  levels (mild 4 mm^2 x 0.5 mm deep, moderate 8 mm^2 x 4 mm, severe 12 mm^2 x 2 mm, as
  given by the authors). Each recording is a full run: from standstill up to 3000 rpm,
  hold, back down to 0, with the speed knob turned by hand; 6-9 runs per state (52
  recordings of 1.5 to 30 s). Accelerometer on the drive-end cover (g) and a
  speed pulse channel (V), 25.6 kHz, Crystal Instruments CoCo-80 (recorded in 2015).
license: unspecified (cite the paper)
size: "download 1.97 GB, built 0.34 GB (measured)"
homepage: https://github.com/shenliuuu/SQ-dataset-with-variable-speed-for-fault-diagnosis
citation: |
  Liu, S., Chen, J., He, S., Shi, Z., & Zhou, Z. (2023). Few-shot learning under domain
  shift: Attentional contrastive calibrated transformer of time series for fault
  diagnosis under sharp speed variation. Mechanical Systems and Signal Processing, 189,
  110071. doi:10.1016/j.ymssp.2022.110071
