name: dcase_bearing
title: DCASE 2022 Challenge Task 2 development dataset, bearing (anomalous sound detection under domain shift)
description: |
  The bearing machine of the DCASE 2022 Challenge Task 2 (unsupervised anomalous sound
  detection under domain shift; data from MIMII DG by Hitachi and NTT): two ball bearings
  supporting a shaft driven by a spindle motor, recorded in an anechoic chamber with real
  factory noise mixed in. Three sections with different domain shifts (rotation velocity,
  microphone location, factory noise); source and target domains; the challenge's train
  set has only normal clips, the test set normal and anomalous ones. Anomalies were made by
  damaging the machine (in 2022, bearing eccentricity); their type is not given per clip,
  so condition is other. 3599 clips of 10 s, mono, 16 kHz (raw int16). dcase_split keeps
  the challenge split for comparison with published results; the package itself makes no
  splits. Later editions (2023-2026) reuse or emulate this machine and are not included.
