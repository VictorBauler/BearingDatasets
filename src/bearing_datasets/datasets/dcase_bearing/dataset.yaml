columns:
  section: DCASE section 00-02 (each with its own domain shift)
  domain: source or target domain
  dcase_split: train (normal only) or test, as in the challenge
  velocity: rotation velocity attribute from the file name (none if not given)
  mic_location: microphone location attribute A-D (none if not given)
  factory_noise: factory noise attribute A or B (none if not given)
