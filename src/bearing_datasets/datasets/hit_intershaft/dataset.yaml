      data2.npy: https://drive.usercontent.google.com/download?id=1RtRVXidVqFivwSnAfApY29XRFwaZVl_A&export=download&confirm=t
      data3.npy: https://drive.usercontent.google.com/download?id=1AilZKGz-Ia9d9JJL6ie-LG4bQJF0T_Wc&export=download&confirm=t
      data4.npy: https://drive.usercontent.google.com/download?id=18B_3N7qVFgjENJgT0LrSsd8zs4fFWszU&export=download&confirm=t
      data5.npy: https://drive.usercontent.google.com/download?id=1Qzk7o93iY-FPd7qp08yvi_EZPrq8kxxM&export=download&confirm=t
files: [data1.npy, data2.npy, data3.npy, data4.npy, data5.npy]
columns:
  fault_depth_mm: depth of the wire-cut fault (0 if healthy)
  fault_length_mm: length of the wire-cut fault (0 if healthy)
  fault_severity: length of the wire-cut fault (inner ring 0.5 or 1.0 mm, levels 1-2; outer ring 0.5 mm, level 1)
  bearing_id: data file = test; each test is a different bearing (data1 and data2 both healthy)
  lp_rpm: low-pressure rotor speed in rpm
  hp_rpm: high-pressure rotor speed in rpm
  segment: number of the 20480-sample segment within the test and speed pair
