name: hit_intershaft
title: HIT inter-shaft bearing dataset (aero-engine test rig, Harbin Institute of Technology)
description: |
  A real dual-rotor aero-engine, driven by low-pressure (LP) and high-pressure (HP)
  motors, with its inter-shaft bearing replaced in turn by a healthy bearing (tested
  twice, data1 and data2), two bearings with wire-cut inner ring faults (0.5 mm deep,
  0.5 or 1.0 mm long) and one with an outer ring fault (0.5 x 0.5 mm). 28 LP/HP speed
  pairs (LP 1000-5000 rpm, HP 1200-6000 rpm, speed ratio 1.2-1.8). Two eddy current
  sensors on the LP rotor (horizontal, vertical displacement) and four accelerometers
  on the casings, 25 kHz. The authors cut each 15 s acquisition into segments of 20480
  samples and removed invalid ones: 2412 segments, stored here as one recording each
  (`segment` numbers them within a speed pair). The authors scaled each channel of each
  acquisition to [-1, 1] (min-max) before cutting it (every speed pair reaches -1 and +1
  exactly): no physical unit (unit normalized), and amplitudes are not comparable between
  speed pairs.
license: unspecified (cite the paper)
size: "download 2.9 GB, built 1.7 GB (measured)"
homepage: https://github.com/HouLeiHIT/HIT-dataset
citation: |
  Hou, L., Yi, H., Jin, Y., Gui, M., Sui, L., Zhang, J., & Chen, Y. (2023). Inter-shaft
  bearing fault diagnosis based on aero-engine system: A benchmarking dataset study.
  Journal of Dynamics, Monitoring and Diagnostics, 2(4), 228-242.
  doi:10.37965/jdmd.2023.314
