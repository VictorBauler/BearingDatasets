name: kaist_rtf
title: KAIST ball bearing vibration and temperature run-to-failure dataset
description: |
  One accelerated life test of an NSK 6205 ball bearing at 1770-1780 rpm, axial load
  2.94 kN and vertical load 5.88 kN, run for 128 hours (2022-06-20 17:00 to
  2022-06-26 01:00; cycles of 5 min running and 15 min running with rest) until the
  bearing temperature exceeded 85 degC and the vibration 9 m/s^2. One 78.125 s
  snapshot per hour (129 snapshots; the last ones are not exactly hourly): vibration
  x and y (PCB 352C34) and bearing / ambient temperature (K-type thermocouples), all
  at 25.6 kHz. Vibration in g (paper; the quantisation matches an NI 9234 with ~98 mV/g
  sensors, and x clips at 51 g). The fault of each snapshot and the failed element are not stated;
  use run_id, time_s and rul_s (end of life = last snapshot). Versions 1-3 of the
  record stated 3600 rpm; this follows version 6 (1770-1780 rpm).
  Every raw file has short gaps stored as NaN (about 40 samples in the vibration and
  80 in the temperature channels); they are kept as published.
license: CC-BY-4.0
size: "download 4.3 GB, built 1.9 GB (measured)"
homepage: https://data.mendeley.com/datasets/5hcdd3tdvb/6
citation: |
  Jung, W., Yun, S.-H., Kim, J., & Park, Y.-H. (2024). Vibration and temperature
  run-to-failure dataset of ball bearing for prognostics. Data in Brief, 110403.
  doi:10.1016/j.dib.2024.110403
sources:
  - type: mendeley
    id: 5hcdd3tdvb
    version: 6
columns:
  bpfo: >-
    NSK 6205 from Jung et al. (2024) (9 balls of 7.90 mm, pitch 38.5 mm)
  speed_rpm: middle of the stated 1770-1780 rpm
  load: vertical load in kN (an axial load of 2.94 kN is also applied)
  time_s: from the time stamp in the file name
