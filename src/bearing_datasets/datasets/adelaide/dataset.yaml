name: adelaide
title: University of Adelaide outer race defect slope and defect length series
license: CC-BY-4.0 (defect slope series), MIT (defect length series)
description: |
  Outer raceway defects machined by EDM, recorded on the same University of Adelaide rig to
  study defect size estimation. Slope series (series=slope): N-type cylindrical roller
  bearing, defects about 110 um deep and 7.5-9.7 mm long with entry/exit slopes of 5, 20,
  30, 45 or 90 degrees, loads 2.5, 5 and 10 kN. Length series (series=length): ball bearing,
  defects 100 um deep and 15.8 or 55.8 degrees long, loads 500-3000 N. Shaft speeds 5, 7.5,
  10 and 12.5 Hz; 10 s at 25.6 kHz. Stored channels are the authors' scaled signals in each
  file: Ex, Ey (eddy-current probes, 50 x V + 250), Ax, Ay (accelerometers, 3.16 x V, sign
  flipped in some files), Load (2260 x V), SPL and Wenglor (unscaled; the file's channel list
  calls this column Acc_z), plus the raw tachometer. Units are not stated. native_label is
  the test prefix of the file name (e.g. Bearing20EDM1or); the same prefix can hold several
  defects, so it is not a bearing identity. There are no healthy recordings.
  License: CC BY 4.0 (slope series), MIT (length series).
size: "download 4.3 GB, built 1.8 GB (measured)"
homepage: https://doi.org/10.6084/m9.figshare.4256594
citation: |
  Larizza, F., Howard, C. Q., & Grainger, S. (2020). Defect size estimation in rolling
  element bearings with angled leading and trailing edges. Structural Health Monitoring.
  doi:10.1177/1475921720938296 (data: figshare, doi:10.6084/m9.figshare.4256594 and related)
  Larizza, F., Moazen-Ahmadi, A., Howard, C. Q., & Grainger, S. (2018). The importance of
  bearing stiffness and load when estimating the size of a defect in a rolling element
  bearing. Structural Health Monitoring. doi:10.1177/1475921718808805
