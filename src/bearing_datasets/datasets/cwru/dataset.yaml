name: cwru
title: Case Western Reserve University bearing data center
description: |
  Seeded (EDM) single-point faults of 0.007"-0.028" on the drive-end (DE) or
  fan-end (FE) bearing of a 2 hp motor, loads 0-3 hp (1797-1720 rpm).
  Accelerometers on the motor casing at the drive end (DE, motor_bearing_de) and fan end
  (FE, motor_bearing_nde), at 12 o'clock, and on the base plate (BA),
  12 kHz or 48 kHz. The record does not state the unit of the accelerations (often
  assumed to be g; the values fit g or the volts of a 100 mV/g sensor). One recording per .mat file (161 files from the 4 official
  index pages). Normal baseline files have no BA channel. The bearing_id of a
  fault is shared by the 4 loads recorded with the same damaged bearing, so
  grouped splits can keep a physical bearing on one side.
  Bearing fault frequencies are in bpfo, bpfi, bsf, ftf (DE 6205-2RS, FE 6203-2RS),
  from CWRU's bearing information page; its "rolling element" column is 2 x BSF
  (4.7135 and 3.9874), stored here halved as the ball spin frequency.
license: "unspecified (public, cite CWRU)"
size: "download 0.69 GB, built 0.16 GB (measured)"
homepage: https://engineering.case.edu/bearingdatacenter
citation: |
  Case Western Reserve University Bearing Data Center,
  https://engineering.case.edu/bearingdatacenter
  Smith, W. A., & Randall, R. B. (2015). Rolling element bearing diagnostics using
  the Case Western Reserve University data: A benchmark study. Mechanical Systems
  and Signal Processing, 64-65, 100-131.
sources:
  - type: http
    base_url: https://engineering.case.edu/sites/default/files/
files: files.csv:file
columns:
  bpfo: >-
    DE channel: drive-end 6205-2RS bearing; FE channel: fan-end 6203-2RS bearing; BA
    (base plate): the tested bearing (the faulty end). Values from CWRU's bearing
    information page (bsf = its rolling-element value / 2)
  fault_severity: fault diameter in inch (0.007, 0.014, 0.021, 0.028), levels 1-4
  bearing_model: >-
    6205-2RS (DE channel), 6203-2RS (FE channel), the tested bearing for BA (base plate)
  or_position: >-
    position of an outer race fault relative to the load zone (6:00 centered, 3:00
    orthogonal, 12:00 opposite); 'none' for other faults
  source_file: original CWRU file (e.g. 105.mat), the number papers usually cite
  load: motor load in hp (0-3)
  fault_size_mm: diameter of the EDM fault (0.007-0.028 inch converted to mm)
  bearing_id: >-
    fault end + fault (e.g. DE_IR007), 'healthy' for normal data; assumes the same
    damaged bearing was used for the 4 loads (common assumption, not stated by CWRU).
    Outer race faults at 3, 6 and 12 o'clock share one id (e.g. DE_OR007): CWRU does not
    say whether each position is a different bearing
