name: sdust
title: SDUST bearing dataset (Shandong University of Science and Technology), bearing subset
description: |
  Fault implantation test rig (AC motor, test bearing, planetary gearbox, magnetic
  powder brake) with 6205 bearings in 10 states: normal (NC), and inner race (IF),
  outer race (OF) and rolling element (RF) faults of 0.2, 0.4 and 0.6 mm. Constant
  speeds of 1000, 1500, 1800, 2000, 2500 and 3000 rpm (plus 1797 rpm at no load) and
  speed varying at random within 800-1500, 1000-2000 or 1500-2500 rpm, each under
  loads of 0, 20, 40 and 60 N. Two triaxial accelerometers (6 channels), 25.6 kHz, about
  41 s per file, LMS Test.Lab. The files name the sensors zcjshang and zcjxia (upper and
  lower support); the dataset PDF says one sensor is on the bearing housing and one on
  the gearbox support without saying which is which. Vibration in m/s^2: the Test.Lab export
  stores SI (MKS) values; its g label is only the display unit (factor 0.10197). Only the bearing subset is included (the
  repository also has a planetary gear subset).
license: unspecified (cite the papers)
size: "download 19.2 GB, built 2.6 GB (measured)"
homepage: https://github.com/JRWang-SDUST/SDUST-Dataset
citation: |
  Wang, J., Zhang, X., Zhang, Z., et al. (2024). Attention guided multi-wavelet
  adversarial network for cross domain fault diagnosis. Knowledge-Based Systems, 284,
  111285. doi:10.1016/j.knosys.2023.111285
