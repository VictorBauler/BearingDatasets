name: army_pla
title: Army Engineering University of PLA mixed fault dataset of bearings and gearboxes under variable operating conditions
description: |
  Drivetrain fault simulator (drive motor, parallel gearbox module, rolling bearing module
  with an NU205 cylindrical roller bearing), constant 20 Nm load. Three subsets:
  bearing (normal; cracks 15 mm long and 2 mm wide on the inner ring, outer ring, a
  rolling element, the cage, or inner + outer ring), parallel gearbox (normal; tooth
  surface wear, broken tooth, eccentric gear) and mixed (inner or outer ring crack combined
  with each gear fault). Each state at 1200, 1800 and 2400 rpm and during a 200-2400-200
  rpm sweep: 64 recordings of 30 s, one triaxial accelerometer (HF7051-1) at 16 kHz. The
  sensor position (shown only in a figure) and the unit are not stated.
license: CC-BY-4.0
size: "download 1.19 GB, built 0.33 GB (measured)"
homepage: https://doi.org/10.17632/yrms2v89p7.1
citation: |
