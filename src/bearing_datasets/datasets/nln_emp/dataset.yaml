columns:
  severity: severity number from the folder name (higher is worse; coupling 2D is a two-sided cut), none if healthy or single-level
  setup: motor_2 or motor_4 (motor-pump set)
  speed_pct: motor speed in % of rated speed
  rpm: motor speed measured during the test (measurement overview), +- 5 rpm
  measurement: vibration or electric (separate acquisition systems)
  sample: number of the 12 s (vibration) or 15 s (electric) sample within the test
