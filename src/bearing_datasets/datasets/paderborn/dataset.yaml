columns:
  bpfo: >-
    computed from each bearing's fact sheet (6203, 8 balls of 6.75 mm, 0 deg); the pitch
    diameter differs by manufacturer: 28.55 mm (FAG) or 29.05 mm (IBU, MTK)
  radial_force_n: radial force on the test bearing in N (F04 = 400, F10 = 1000)
  repetition: repetition number 1-20 of the measurement for the same condition
  damage: >-
    how the damage was made: EDM, drilling, electric engraver (artificial) or pitting,
    indentation (real, from accelerated lifetime tests); 'none' if healthy
  bearing_manufacturer: manufacturer of the test bearing (FAG, IBU, MTK)
  load: load torque in Nm (M01 = 0.1, M07 = 0.7)
  speed_rpm: nominal speed (N09 = 900, N15 = 1500)
  fault_severity: damage extent level 1-3 from the KAt fact sheets (none = healthy, level 0)
  operating_condition: N<speed>_M<torque>_F<radial force> from the file name (e.g. N15_M07_F04)
  bearing_id: KAt bearing code (K001-K006 healthy, KA outer race, KI inner race, KB both)
