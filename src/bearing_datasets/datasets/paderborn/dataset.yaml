name: paderborn
title: Paderborn University (KAt) bearing data center
description: |
  32 ball bearings (6203): 6 healthy, 12 with artificial damage (EDM, drilling,
  electric engraver) and 14 with real damage from accelerated lifetime tests.
  4 operating conditions (N15/N09 = 1500/900 rpm, M07/M01 = 0.7/0.1 Nm,
  F10/F04 = 1000/400 N radial force) x 20 repetitions of 4 s = 2560 recordings.
  Channels: housing vibration and 2 motor phase currents (64 kHz), radial force,
  speed and torque (4 kHz), bearing-module temperature (1 Hz).
  Damage method and extent level per bearing are in bearings.csv (from the KAt
  fact sheets, Lessmeier et al. 2016).
  2560 recordings. N15_M01_F10_KA08_2.mat in the official KA08.rar is cut off after
  8,192,000 bytes and zero-filled (MATLAB cannot open it); it is read from its intact part:
  all channels are complete except the vibration, which keeps its first 2.98 s
  (190,937 samples instead of about 256,000).
license: CC-BY-NC-4.0
size: "download 5.4 GB, built 4.2 GB (measured)"
homepage: https://groups.uni-paderborn.de/kat/BearingDataCenter/
citation: |
  Lessmeier, C., Kimotho, J. K., Zimmer, D., & Sextro, W. (2016). Condition
  monitoring of bearing damage in electromechanical drive systems by using motor
  current signals of electric motors: a benchmark data set for data-driven
  classification. PHM Society European Conference, 3(1).
