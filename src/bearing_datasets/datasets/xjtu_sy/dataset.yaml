columns:
  bpfo: >-
    LDK UER204 from the authors' parameter table (8 balls of 7.92 mm, pitch 34.55 mm)
  load: radial load in kN (12, 11 or 10)
  failure: element(s) found failed at the end of the run (from the paper)
  operating_condition: operating condition folder (35Hz12kN, 37.5Hz11kN, 40Hz10kN)
  snapshot: snapshot number inside the run (the file number)
