name: arkansas
title: University of Arkansas single and double fault scenarios for a rotary machine
description: |
  SpectraQuest rotary machine fault simulator at the University of Arkansas: DC motor, shaft
  on a left (bearing 1) and right (bearing 2) bearing with two disks, belt and gearbox.
  Bearing faults: inner race, outer race, ball, or combination (a ball and a raceway defect;
  fault_type bearing); shaft bent at the center or at the coupling end. 11 single faults, 27
  double faults (one fault per component) and no fault, at three speed settings (25, 50, 75;
  the record calls them rpm, the unit is uncertain), 25 trials of 10 s each: 2925
  recordings at 6.4 kHz. Channels: tachometer (V) and 8 accelerometers (PCB 608A11, g) on the
  motor, both bearing housings (x, y, z) and the gearbox. Bearing 1 (left, motor side) is
  test_bearing_de, bearing 2 test_bearing_nde.
license: CC-BY-4.0
size: "download 14.8 GB, built 3.0 GB (measured)"
