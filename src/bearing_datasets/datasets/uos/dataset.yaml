name: uos
title: University of Seoul multi-domain vibration dataset with various bearing types under compound machine fault scenarios
description: |
  AST machinery fault simulator (40 W BLDC motor, shaft, two rotor disks, two bearing
  housings) at the University of Seoul. Three bearing types, one record each: deep groove
  ball (MOCHU 6204), cylindrical roller (NTN N204, and NJ204 for the inner race fault) and
  tapered roller (NTN 30204). Bearing condition healthy, ball, inner race or outer race
  fault, combined with rotor condition healthy, misalignment (3 levels), unbalance (3 levels)
  or looseness: 32 states x 6 speeds (600-1600 rpm) x 2 sampling rates (8 kHz for 160 s,
  16 kHz for 80 s; separate acquisitions, 1,280,000 samples each) x 3 bearing types = 1152
  recordings. One accelerometer (PCB 333D01, g) on top of the bearing housing at the shaft
  end. The files also hold precomputed spectrograms, which are not stored. Made for
  multi-domain (bearing type, speed, sampling rate) and compound-fault studies.
license: CC-BY-4.0
size: "download 22.4 GB, built 4.7 GB (measured)"
homepage: https://doi.org/10.17632/53vtnjy6c6.1
citation: |
  Lee, S., Kim, T., & Kim, T. (2024). Multi-domain vibration dataset with various bearing
  types under compound machine fault scenarios. Data in Brief, 57, 110940.
  doi:10.1016/j.dib.2024.110940
