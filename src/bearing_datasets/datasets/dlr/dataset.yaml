name: dlr
title: German Aerospace Center (DLR) vibration data for axial ball bearings with spall faults
description: |
  FAG QJ212TVP four-point-contact ball bearings (a common aerospace model) mounted
  vertically on a FALEX test bench, axially loaded with 5 or 8.8 kN at 60 or 500 rpm.
  Healthy, and artificially seeded spalls on the inner race (1.0, 2.1, 3.8 mm wide) or
  the outer race (1.4, 2.4, 4.0 mm wide): 28 recordings of 30 s at 25.6 kHz from one
  accelerometer (PCB 356A32) on the bearing outer race. Unit not stated; the values are in m/s^2: their ADC step is
  9.68 mV per unit, the PCB 356A32's 10.2 mV/(m/s^2) (100 mV/g), and their peak (355) would
  exceed the sensor's +-50 g range in g.
license: CC-BY-4.0
size: "download 0.16 GB, built 0.08 GB (measured)"
homepage: https://data.mendeley.com/datasets/chwhh9n3bf/1
citation: |
  Ismail, M. A. A., Windelberg, J., Bierig, A., Bravo, I., & Arnaiz, A. (2023). Ball
  bearing vibration data for detecting and quantifying spall faults. Data in Brief, 47,
  109019. doi:10.1016/j.dib.2023.109019
sources:
  - type: mendeley
    id: chwhh9n3bf
    version: 1
columns:
  bpfo: >-
    FAG QJ212TVP from Ismail et al. (2023), Table 1 (15 balls of 15.87 mm, pitch 85.15 mm);
    contact angle 35 deg, not stated but matching the published BPFO and BPFI
  fault_size_mm: spall width (0 if healthy)
  fault_severity: spall width; levels 1-3 per race (inner 1.0, 2.1, 3.8 mm; outer 1.4, 2.4, 4.0 mm)
  load: axial load in kN (5 or 8.8)
