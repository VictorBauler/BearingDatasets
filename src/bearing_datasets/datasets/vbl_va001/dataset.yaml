columns:
  bpfo: >-
    NTN 6201: BPFO 2.62 and BPFI 4.38 from the datasheet quoted in the authors' README; FTF
    and BSF derived from them (7 balls, d/D = 0.25143, 0 deg)
  unbalance_gcm: unbalance in gram.cm (6 or 27; 0 for the other pumps)
  file_series: main, or z for the files whose name carries "_z" (not explained by the authors)
