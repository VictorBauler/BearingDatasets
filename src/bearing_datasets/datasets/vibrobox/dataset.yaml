name: vibrobox
title: VibroBox bearing 6213 vibration datasets (constant, moderately and widely varying speed)
description: |
  Five VibroBox (Minsk) records of a rolling bearing analogous to 6213, normal and with an
  outer ring fault, on the same test stand; accelerometer (B&R, stud mounted, 32 mV/g,
  4 Hz-8 kHz) recorded at 96 kHz as raw integer wav samples. Subsets: const_973rpm (20
  normal, 20 with a severe outer ring defect and an incipient inner ring defect, 10 s);
  const_800_900rpm (120 outer ring fault recordings at 800-900 rpm in 5 rpm steps; the
  speeds of files 181-195 are not in the table: unknown); const_50_900rpm (normal and
  outer ring fault at 50-900 rpm, 30 s); moderate_ramps (speed changed by 1-10 rpm from
  650-975 rpm, 60 s); varying_0_900rpm (random, linear or triangle speed profiles over 0-900
  rpm, 60 s). The two varying-speed subsets include the tachometer (speed / 30, irregularly
  sampled; exact times in tach_time_unix). Labels and speeds come from the records' docx
  tables (meta.csv). bearing_model: the 6213 the test bearing is analogous to.
