name: isac
title: ISAC Lab rotating machinery vibration dataset for bearing and unbalance faults (University of Guilan)
description: |
  Rotating machine test rig of the Intelligent Systems and Advanced Control Lab (ISAC),
  University of Guilan, with three bearings and six disks. Healthy at 10-50 Hz shaft
  frequency (twice, 60 s; with a 0.02 mm shaft misalignment); outer race or ball fault with
  the defective bearing in position 1, 2 or 3; unbalance on one of the disks 1 (largest) to
  6 (smallest) or on disks 1 and 4; faults at 10 and 30 Hz. 35 recordings of 60 s, 12
  analog channels in V at about 10 kHz (the file's time step gives 10,040 Hz). Which sensor
  is on which channel is not documented (ai0-ai11); the bearing model is not stated. The
  startup/shutdown noise recordings described in the record are not in the archive.
