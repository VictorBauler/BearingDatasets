    SKF 1205 ETN9 from Arpa et al. (2024), Table 2, per row (12 balls of 7.12 mm, 10.2 deg,
    pitch 38.09 mm from the race radii); matches the paper's Table 3
  load: radial load in kN
  time_s: nominal, from the 5-minute acquisition interval (1 hour for the first 453 files of E4)
