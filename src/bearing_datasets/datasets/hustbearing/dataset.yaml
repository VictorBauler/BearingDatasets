name: hustbearing
title: HUSTbearing dataset (Huazhong University of Science and Technology), constant and time-varying speed
description: |
  ER-16K ball bearings on a SpectraQuest simulator in 9 health states (healthy;
  inner race, outer race, ball and inner+outer faults, each medium and severe) at
  10 constant speeds (20-80 Hz) and one time-varying speed (0-40-0 Hz): 99
  recordings. Triaxial accelerometer (X, Y, Z), 25.6 kHz, 262144 samples (10.24 s).
  All faults are artificial. Fault sizes: inner/outer race 0.15 mm (medium) and
  0.3 mm (severe); ball 0.25 mm and 0.5 mm; the combination fault is inner+outer.
  The files also hold a speed column that the authors say is meaningless (the speed
  is in the file name), so it is not stored.
  Download: 99 text files (.xls extension) from the authors' Google Drive.
license: unspecified (cite the paper)
size: "download 1.2 GB, built 0.28 GB (measured)"
homepage: https://github.com/CHAOZHAO-1/HUSTbearing-dataset
citation: |
  Zhao, C., Zio, E., & Shen, W. (2024). Domain generalization for cross-domain fault
  diagnosis: An application-oriented perspective and a benchmark study. Reliability
  Engineering & System Safety, 245, 109964. doi:10.1016/j.ress.2024.109964
