columns:
  bpfo: >-
    ER-16K (named in the dataset README) with the ER16K geometry of Huang & Baddour (2018):
    9 balls of 7.94 mm, pitch 38.52 mm
  operating_condition: >-
    motor speed from the file name: 20Hz to 80Hz (constant) or 0-40-0Hz (speed
    ramped up to 40 Hz and back down)
  severity: medium or severe fault (medium files are prefixed 0.5X), none if healthy
  fault_size_mm: >-
    from the authors' README: race faults 0.15 mm (medium) / 0.3 mm (severe), ball faults
    0.25 / 0.5 mm; the combination fault is listed with its race size
  bearing_id: >-
    severity + fault code (e.g. severe_B); assumes one bearing per health state, reused
    at every speed
