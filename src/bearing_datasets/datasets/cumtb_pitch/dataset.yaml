columns:
  fault_type: crack, spalling or wear (none if healthy)
  rpm: bearing speed, 1 or 3 rpm
  load_condition: time-varying load profile Cond_1, Cond_2 or Cond_3
  chunk: number of the ~26 s chunk within the 10 min acquisition
