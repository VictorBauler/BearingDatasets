name: saarland
title: Saarland University machine learning dataset of artificial inner ring damages on cylindrical roller bearings under varying cross-influences
description: |
  Designed for domain-shift research: three Schaeffler NU206-E-XL-TVP2 cylindrical roller
  bearings (B10, B20, B30) measured on a servo-motor test bed first undamaged and then with
  a small inner ring defect made with a milling cutter (1.7-2.2 mm wide, 2.6-3.3 mm long),
  under a designed experiment of speed (85, 392, 706, 969 rpm), radial load level (0-3,
  about 0 / 1600 / 2500 / 3300 N), mounting position (A-D), three sensor-mounting runs and
  two workers: 1151 recordings of 60 s at 20 kHz from one triaxial accelerometer (unit not
  stated). Deviations from the nominal assembly (sensor mounting, coupling mounting, second
  shaft) are recorded per measurement; missing values are "unknown". The metadata comes
  from the dataset's info.csv; temperature and humidity (missing for 203 recordings) are
  not included. Made for leave-one-group-out cross-validation (e.g. group by bearing_id,
  mounting_position or run).
  The archive also contains 425 files at 201 and 592 rpm that are not in info.csv, and
  misfiled copies of some files; they are not used.
