columns:
  bpfo: >-
    Schaeffler factors of the NU206-E-XL-TVP2 test bearing from Schnur et al. (2025), Table
    1 (FTF for a rotating inner ring; plain BSF)
  fault_size_mm: width of the inner ring defect (0 if undamaged)
  damage_length_mm: length of the inner ring defect (0 if undamaged)
  bearing_id: test bearing B10, B20 or B30 (each measured undamaged and damaged)
  speed_rpm: measured speed
  speed_setpoint_rpm: set speed (85, 392, 706 or 969 rpm)
  force_level: radial load level 0-3 (about 0, 1600, 2500, 3300 N)
  mounting_position: mounting position of the test bearing, A-D
  run: sensor-mounting run 1-3
  worker: worker who mounted the bearing, 1 or 2
  sensor_mounting_deviation: assembly deviation code of the sensor mounting (0/1; unknown if not recorded)
  coupling_mounting: assembly deviation code of the coupling mounting (0-2; unknown if not recorded)
  second_shaft: 1 if the second shaft was used (0/1; unknown if not recorded)
  measurement_batch: measurement batch 1-48
  measurement_day: measurement day number
