name: hust_transmission
title: HUST transmission system dataset (Huazhong University of Science and Technology), distributed and compound faults
description: |
  SQI transmission chain rig: motor (Marathon D393A), coupling, shaft on two ER-16K
  bearings, belt and pulley, Hub City M2 gearbox. 14 system health states from the Readme:
  healthy; single faults of the motor (mechanical), left bearing (outer race), shaft (crack),
  right bearing (inner race), right bearing housing (warping), belt pulley (eccentricity),
  gearbox (missing tooth); and 6 compound states. Each at 20, 30, 40, 50, 60, 70 Hz and one
  0-70-0 Hz run-up/run-down: 98 recordings (10.24 s; 30.7 s for the run), four single-axis accelerometers (g)
  on the motor, both bearing housings and the gearbox, 25.6 kHz. native_label keeps the
  component codes (e.g. M1_LB1_S0_RB0_RH0_BP0_G1). No license stated.
license: unspecified (cite the paper)
size: "download 1.7 GB, built 0.37 GB (measured)"
homepage: https://github.com/CHAOZHAO-1/HUSTTransmissionsystem-dataset
citation: |
  Zhao, C., Shen, W., Zio, E., & Ma, H. (2025). Environment-aware graph relational reasoning
  for interpretable and generalizable mechanical transmission system distributed fault
  diagnosis. Expert Systems with Applications, 130962. doi:10.1016/j.eswa.2025.130962
