name: tecnalia_gearbox
title: Tecnalia gearbox with gear and bearing faults under variable speed and load conditions
description: |
  Tecnalia test rig: speed-controlled AC motor, two-stage Test Gearbox (29/100, 36/90), a
  Load Gearbox and a torque-controlled load motor. Scenarios: baseline, broken tooth on the
  36-tooth gear, outer race fault on the Test Gearbox input bearing (ER-16KCL; fault
  frequencies in bpfo, bpfi, bsf, ftf), and both. Conditions: stationary (1500 rpm, 70% load),
  variable speed (840 -> 1400 -> 1000 rpm at 70% load), variable load (20 -> 80 -> 50% at
  1500 rpm) and both varying. 14 tests of 10-12.8 s (tests 9 and 13, bearing fault under
  variable speed, are not in the release), 16 channels at 20.48 kHz: tachometer, two
  encoders, torque, two motor currents, 8 accelerometers (drive motor, Test Gearbox input
  and output bearings, Load Gearbox bearings, load motor) and the axial force of the Test
  Gearbox bearing; channel16 is not described. The Test Gearbox and drive motor are
  gearbox and motor; the Load Gearbox and load motor, the rig's loading system, are rig.
  Values are the recorded volts. The sensitivity column comes from the Volts/Unit row of the
  file headers (the same in every test): 94-101 mV/g for the accelerometers and 0.1 V/A for
  the current transformers. The torque (0.5 V/unit) and force (0.000498 V/unit) sensitivities
  do not name their unit and are left unknown.
