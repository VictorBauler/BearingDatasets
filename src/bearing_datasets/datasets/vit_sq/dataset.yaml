    MB ER-10K from the paper's Table 2 (8 balls of 7.939 mm, pitch 33.503 mm); the paper's
    text gives other dimensions, the table matches MB's published multipliers
  added_mass_g: load in grams from the file name (0, 6, 12), presumably masses added on the balance rotor
