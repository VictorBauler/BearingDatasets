name: lenze_mb
title: Lenze motor bearing fault dataset (Lenze-MB), drive signals only
description: |
  Inner ring damage of FAG NU2205-E-XL-TVP2 cylindrical roller bearings, mounted outside
  a PMSM driven by a Lenze i950 inverter, detected only from signals the drive already
  has: phase currents and voltages, DC bus voltage, encoder angle, current vector,
  speed and speed deviation, all logged by the inverter at 16 kHz (32.8 s). No
  vibration sensor. Classes: normal, 5 levels of local pitting (pitting_I to
  pitting_V) and a heavy, wide artificial damage (scientific_fault); each at 4 speeds
  (900, 1000, 1375, 1500 rpm), load torque 0 or 2 Nm and belt tension 250 or 500
  (radial force): 112 recordings. Labels come from Meta_Data.xlsx (copied as meta.csv).
  Currents (A), voltages and DC bus (V) are in physical units (technical report). The
  angle is in revolutions (-0.5 to 0.5; its mean step x 16 kHz matches the shaft speed).
  speed is in revolutions per sample (x 16000 = rev/s, so its unit is unknown), and
  current_vector and speed_deviation are inverter-internal values of undocumented scale;
  the report's conversions (x 20000 / 2^32, x 3/4) do not match the stored values.
  License CC BY-NC 4.0 (non-commercial).
