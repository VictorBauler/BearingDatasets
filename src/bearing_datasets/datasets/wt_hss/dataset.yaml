name: wt_hss
title: Wind turbine high-speed shaft bearing prognosis data (field, 50 days)
description: |
  Field data from the high-speed shaft bearing of a 2 MW wind turbine (20-tooth pinion)
  whose inner race fault developed over 50 days (7 March to 25 April 2013): one
  acquisition per day, 6 s of vibration at 97656 Hz, and the times of the tachometer
  pulses (channel tach_times_s: times in s, not a sampled signal; its fs is the mean
  pulse rate). Data by Eric Bechhoefer (Green Power Monitoring Systems), redistributed by
  MathWorks, who merged the sensor and tach files of each day. Run-to-failure: use run_id,
  time_s and rul_s (end of life = last acquisition, from the time stamps); the condition
  of each day is unknown, the failure at the end was an inner race fault.
  License CC BY-NC-SA 4.0 (non-commercial).
