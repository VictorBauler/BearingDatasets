columns:
  bpfo: >-
    SKF 6205-2Z-C3 from the data paper, Table 3 (9 balls of 7.94 mm, pitch 39.04 mm); its
    Table 7 gives the same BPFO, BPFI and plain BSF
  fault_severity: >-
    severity of each fault in fault_type order (light, high or "not graded"), + joined; none
    if healthy. Level: 1 light, 2 high, 1 if not graded; the highest of the recording's faults
  speed_profile: varying when the speed cycles, constant when the load cycles
  speed_rpm: >-
    set motor speed, not measured (constant when the load varies, peak of the cycle when the speed varies)
  load: >-
    load torque in Nm (constant when the speed varies, peak of the cycle when the load varies)
